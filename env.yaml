name: yap
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  - python>=3.10
  - pip
  - parallel
  - jupyter
  - snakemake
  - mamba
  - natsort
  - anndata
  - yaml
  - biopython
  - cutadapt=4.7
  - bismark=0.20
  - bowtie2
  - bowtie
  - samtools
  - picard=3.1.1
  - bedtools
  - htslib
  - pyBigWig
  - ucsc-bedgraphtobigwig
