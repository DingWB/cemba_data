  - pytables # for mct
  - subread=2.0.8
  - git
  - ipython
  - hdf5
  - ipykernel
  - graphviz
  - fire
  - papermill
  - nbconvert-webpdf
  # - gdown=5.1.0
  - scikit-learn=1.2.2
  - cytozip
  - pip:
    - pybedtools==0.9.1
    - pysam==0.20.0
    - git+https://github.com/DingWB/cemba_data
    - git+https://github.com/DingWB/ALLCools